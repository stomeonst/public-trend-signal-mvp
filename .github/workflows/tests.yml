name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild proof artifacts
        run: |
          rm -rf build-ci
          python -m trend_signal.cli \
            --input examples/fictional_signals.jsonl \
            --output-dir build-ci
      - name: Compare reproducible outputs
        run: diff -ru build build-ci
